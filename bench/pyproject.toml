[project]
name = "redraft-bench"
version = "0.1.0"
description = "Milestone zero: how much of a stale LLM output survives greedy verification after a context edit"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gpu = ["torch>=2.4", "transformers>=4.51"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]
