[project]
name = "redraft-replay"
version = "0.1.0"
description = "Replays Loom C1 correction events through redraftd and judges baseline against redraft at the fact level"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
redraft-replay = "replay.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["replay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
