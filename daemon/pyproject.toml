[project]
name = "redraftd"
version = "0.1.0"
description = "Session-based local daemon fronting the patched llama-server for redraft integrations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "redraft-client",
]

[project.scripts]
redraftd = "daemon.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv.sources]
redraft-client = { path = "../clients/python/redraft_client", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daemon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
